name: run-script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Créer config.ini depuis les secrets GitHub
        run: |
          echo "[BITRIX]" > config.ini
          echo "BITRIX_DOMAIN = ${{ secrets.BITRIX_DOMAIN }}" >> config.ini
          echo "BITRIX_TOKEN = ${{ secrets.BITRIX_TOKEN }}" >> config.ini

      - name: Exécuter le script Python
        run: |
          python Automation.py
